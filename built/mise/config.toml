[tools]
bun = "1.3.3"
deno = "2.3.3"
go = "latest"
node = ['23.11.0']
pkl = "0.28.2"
python = "3.13.4"
uv = "latest"
rust = "latest"
"npm:@openai/codex" = { version = "latest", minimum_release_age = "0s" }
"npm:vercel" = "latest"
"npm:opencode-ai" = "1.0.191"
"npm:@anthropic-ai/claude-code" = "2.1.133"
"npm:@sourcegraph/amp" = "0.0.1768035453-g894cb5"
"npm:agent-browser" = "latest"
"npm:kagi-cli" = "0.3.3"
pi = { version = "latest", minimum_release_age = "0s" }
"npm:pi-pack" = "latest"
# Slack re-auth needs localhost callback support: https://github.com/apify/mcpc/issues/269
"npm:@apify/mcpc" = "0.3.1"
"github:mtford90/revue" = { version = "latest", minimum_release_age = "0s" }

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]
experimental = true

# Mise on NixOS sets this to true by default https://mise.jdx.dev/configuration/settings.html#all_compile
# We have programs.nix-ld.enable = true; so we don't need to compile everything
all_compile = false
